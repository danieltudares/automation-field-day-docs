name: Publish DC1 documentation

on:
  push:
    branches:
      - main
    paths:
      - sites/DC1/documentation/**
      - sites/DC1/anta/**
      - docs/**
      - pages/**
      - .github/workflows/prod-docs.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static documentation portal
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          python pages/scripts/build_site.py --output "${RUNNER_TEMP}/dc1-site"

          test -f "${RUNNER_TEMP}/dc1-site/index.html"
          test -f "${RUNNER_TEMP}/dc1-site/assets/data/site.json"
          test -f "${RUNNER_TEMP}/dc1-site/content/reports/anta_report.md"
          test -f "${RUNNER_TEMP}/dc1-site/content/reports/psirt_report.md"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/dc1-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
