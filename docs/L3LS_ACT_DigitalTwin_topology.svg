  <text x="150" y="750" text-anchor="middle" class="node-name">DC1-HOST1</text>
  <text x="150" y="768" text-anchor="middle" class="node-role">GENERIC · UBUNTU</text>
  <text x="150" y="801" text-anchor="middle" class="node-detail">192.168.0.201</text>
  <text x="150" y="825" text-anchor="middle" class="node-detail">eth1 ← L1 Et5</text>
  <text x="150" y="845" text-anchor="middle" class="node-detail">eth2 ← L2 Et5</text>

  <text x="370" y="750" text-anchor="middle" class="node-name">DC1-HOST2</text>
