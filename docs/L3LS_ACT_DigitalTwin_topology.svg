  <text x="630" y="801" text-anchor="middle" class="node-detail">192.168.0.203</text>
  <text x="630" y="825" text-anchor="middle" class="node-detail">eth1 ← L3 Et5</text>
  <text x="630" y="845" text-anchor="middle" class="node-detail">eth2 ← L4 Et5</text>

  <text x="850" y="750" text-anchor="middle" class="node-name">DC1-HOST4</text>
