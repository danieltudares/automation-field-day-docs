  <text x="1330" y="495" text-anchor="middle" class="node-name">DC1-BORDERLEAF2</text>
  <text x="1330" y="513" text-anchor="middle" class="node-role">BORDER · MLAG 3</text>
  <text x="1330" y="548" text-anchor="middle" class="node-detail">192.168.0.106</text>
  <text x="1330" y="574" text-anchor="middle" class="node-detail">Et1 → S1 Et6</text>
  <text x="1330" y="594" text-anchor="middle" class="node-detail">Et2 → S2 Et6</text>
  <text x="1330" y="620" text-anchor="middle" class="node-detail">Et3/Et4 → peer</text>

  <!-- MLAG peer links. -->
