    <rect x="60" y="725" width="180" height="140" rx="12" fill="#fff"/>
    <path d="M72 725 H228 A12 12 0 0 1 240 737 V775 H60 V737 A12 12 0 0 1 72 725Z" fill="#047857"/>
    <rect x="280" y="725" width="180" height="140" rx="12" fill="#fff"/>
    <path d="M292 725 H448 A12 12 0 0 1 460 737 V775 H280 V737 A12 12 0 0 1 292 725Z" fill="#047857"/>
