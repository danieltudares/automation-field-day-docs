  <line x1="200" y1="574" x2="280" y2="574" class="mlag-b"/>
  <text x="240" y="538" text-anchor="middle" class="link-note">Et3</text>
  <text x="240" y="592" text-anchor="middle" class="link-note">Et4</text>

  <line x1="680" y1="545" x2="760" y2="545" class="mlag-a"/>
  <line x1="680" y1="574" x2="760" y2="574" class="mlag-b"/>
  <text x="720" y="538" text-anchor="middle" class="link-note">Et3</text>
  <text x="720" y="592" text-anchor="middle" class="link-note">Et4</text>

  <line x1="1160" y1="545" x2="1240" y2="545" class="mlag-a"/>
  <line x1="1160" y1="574" x2="1240" y2="574" class="mlag-b"/>
  <text x="1200" y="538" text-anchor="middle" class="link-note">Et3</text>
  <text x="1200" y="592" text-anchor="middle" class="link-note">Et4</text>

