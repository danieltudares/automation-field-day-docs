<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">L3LS ACT Digital Twin topology</title>
  <desc id="desc">Two-spine leaf-spine topology with four leaves, two border leaves, and four dual-attached Linux hosts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font-family: sans-serif; font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: sans-serif; font-size: 14px; fill: #475569; }
      .tier { font-family: sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .node-name { font-family: sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
      .node-role { font-family: sans-serif; font-size: 11px; font-weight: 600; fill: #dbeafe; letter-spacing: 1px; }
      .node-detail { font-family: monospace; font-size: 12px; fill: #334155; }
      .link-note { font-family: monospace; font-size: 11px; fill: #475569; }
      .legend { font-family: sans-serif; font-size: 12px; fill: #334155; }
      .uplink-a { fill: none; stroke: #0284c7; stroke-width: 3; stroke-linecap: round; opacity: .76; }
      .uplink-b { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; opacity: .76; }
      .mlag-a { stroke: #db2777; stroke-width: 4; stroke-linecap: round; }
      .mlag-b { stroke: #db2777; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 8 5; }
      .host-link { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; opacity: .82; }
    </style>
  </defs>

  <rect width="1440" height="1020" fill="#f8fafc"/>
  <rect x="18" y="18" width="1404" height="984" rx="18" fill="none" stroke="#cbd5e1"/>

  <text x="50" y="58" class="title">L3LS ACT Digital Twin</text>
  <text x="50" y="83" class="subtitle">8 vEOS nodes · 4 generic hosts · 12 fabric uplinks · 6 MLAG peer links · 8 host links · EOS 4.35.4M</text>

  <text x="50" y="137" class="tier">SPINE TIER</text>
  <text x="50" y="445" class="tier">LEAF TIER</text>
  <text x="50" y="695" class="tier">HOST TIER</text>

  <!-- Spine-to-leaf links: blue = SPINE1, violet = SPINE2. -->
  <path class="uplink-a" d="M470 250 C470 340 110 355 110 470"/>
  <path class="uplink-a" d="M470 250 C470 340 370 355 370 470"/>
  <path class="uplink-a" d="M470 250 C470 340 590 355 590 470"/>
  <path class="uplink-a" d="M470 250 C470 340 850 355 850 470"/>
  <path class="uplink-a" d="M470 250 C470 340 1070 355 1070 470"/>
  <path class="uplink-a" d="M470 250 C470 340 1330 355 1330 470"/>

  <path class="uplink-b" d="M970 250 C970 340 110 355 110 470"/>
  <path class="uplink-b" d="M970 250 C970 340 370 355 370 470"/>
  <path class="uplink-b" d="M970 250 C970 340 590 355 590 470"/>
  <path class="uplink-b" d="M970 250 C970 340 850 355 850 470"/>
  <path class="uplink-b" d="M970 250 C970 340 1070 355 1070 470"/>
  <path class="uplink-b" d="M970 250 C970 340 1330 355 1330 470"/>

  <!-- Spine cards. -->
  <g filter="url(#shadow)">
    <rect x="350" y="150" width="240" height="100" rx="12" fill="#fff"/>
    <path d="M362 150 H578 A12 12 0 0 1 590 162 V201 H350 V162 A12 12 0 0 1 362 150Z" fill="url(#spine)"/>
    <rect x="850" y="150" width="240" height="100" rx="12" fill="#fff"/>
    <path d="M862 150 H1078 A12 12 0 0 1 1090 162 V201 H850 V162 A12 12 0 0 1 862 150Z" fill="url(#spine)"/>
  </g>
  <text x="470" y="176" text-anchor="middle" class="node-name">DC1-SPINE1</text>
  <text x="470" y="193" text-anchor="middle" class="node-role">SPINE</text>
  <text x="470" y="222" text-anchor="middle" class="node-detail">192.168.0.11</text>
  <text x="470" y="240" text-anchor="middle" class="node-detail">Et1–Et6 → leaf tier</text>
  <text x="970" y="176" text-anchor="middle" class="node-name">DC1-SPINE2</text>
  <text x="970" y="193" text-anchor="middle" class="node-role">SPINE</text>
  <text x="970" y="222" text-anchor="middle" class="node-detail">192.168.0.12</text>
  <text x="970" y="240" text-anchor="middle" class="node-detail">Et1–Et6 → leaf tier</text>

  <!-- Leaf cards. -->
  <g filter="url(#shadow)">
    <rect x="20" y="470" width="180" height="170" rx="12" fill="#fff"/>
    <path d="M32 470 H188 A12 12 0 0 1 200 482 V523 H20 V482 A12 12 0 0 1 32 470Z" fill="url(#leaf)"/>
    <rect x="280" y="470" width="180" height="170" rx="12" fill="#fff"/>
    <path d="M292 470 H448 A12 12 0 0 1 460 482 V523 H280 V482 A12 12 0 0 1 292 470Z" fill="url(#leaf)"/>
    <rect x="500" y="470" width="180" height="170" rx="12" fill="#fff"/>
    <path d="M512 470 H668 A12 12 0 0 1 680 482 V523 H500 V482 A12 12 0 0 1 512 470Z" fill="url(#leaf)"/>
    <rect x="760" y="470" width="180" height="170" rx="12" fill="#fff"/>
    <path d="M772 470 H928 A12 12 0 0 1 940 482 V523 H760 V482 A12 12 0 0 1 772 470Z" fill="url(#leaf)"/>
    <rect x="980" y="470" width="180" height="170" rx="12" fill="#fff"/>
    <path d="M992 470 H1148 A12 12 0 0 1 1160 482 V523 H980 V482 A12 12 0 0 1 992 470Z" fill="url(#border)"/>
    <rect x="1240" y="470" width="180" height="170" rx="12" fill="#fff"/>
    <path d="M1252 470 H1408 A12 12 0 0 1 1420 482 V523 H1240 V482 A12 12 0 0 1 1252 470Z" fill="url(#border)"/>
  </g>

  <text x="110" y="495" text-anchor="middle" class="node-name">DC1-LEAF1</text>
  <text x="110" y="513" text-anchor="middle" class="node-role">LEAF · MLAG 1</text>
  <text x="110" y="548" text-anchor="middle" class="node-detail">192.168.0.101</text>
  <text x="110" y="574" text-anchor="middle" class="node-detail">Et1 → S1 Et1</text>
  <text x="110" y="594" text-anchor="middle" class="node-detail">Et2 → S2 Et1</text>
  <text x="110" y="620" text-anchor="middle" class="node-detail">Et3/Et4 → peer</text>

  <text x="370" y="495" text-anchor="middle" class="node-name">DC1-LEAF2</text>
  <text x="370" y="513" text-anchor="middle" class="node-role">LEAF · MLAG 1</text>
  <text x="370" y="548" text-anchor="middle" class="node-detail">192.168.0.102</text>
  <text x="370" y="574" text-anchor="middle" class="node-detail">Et1 → S1 Et2</text>
  <text x="370" y="594" text-anchor="middle" class="node-detail">Et2 → S2 Et2</text>
  <text x="370" y="620" text-anchor="middle" class="node-detail">Et3/Et4 → peer</text>

  <text x="590" y="495" text-anchor="middle" class="node-name">DC1-LEAF3</text>
  <text x="590" y="513" text-anchor="middle" class="node-role">LEAF · MLAG 2</text>
  <text x="590" y="548" text-anchor="middle" class="node-detail">192.168.0.103</text>
  <text x="590" y="574" text-anchor="middle" class="node-detail">Et1 → S1 Et3</text>
  <text x="590" y="594" text-anchor="middle" class="node-detail">Et2 → S2 Et3</text>
  <text x="590" y="620" text-anchor="middle" class="node-detail">Et3/Et4 → peer</text>

  <text x="850" y="495" text-anchor="middle" class="node-name">DC1-LEAF4</text>
  <text x="850" y="513" text-anchor="middle" class="node-role">LEAF · MLAG 2</text>
  <text x="850" y="548" text-anchor="middle" class="node-detail">192.168.0.104</text>
  <text x="850" y="574" text-anchor="middle" class="node-detail">Et1 → S1 Et4</text>
  <text x="850" y="594" text-anchor="middle" class="node-detail">Et2 → S2 Et4</text>
  <text x="850" y="620" text-anchor="middle" class="node-detail">Et3/Et4 → peer</text>

  <text x="1070" y="495" text-anchor="middle" class="node-name">DC1-BORDERLEAF1</text>
  <text x="1070" y="513" text-anchor="middle" class="node-role">BORDER · MLAG 3</text>
  <text x="1070" y="548" text-anchor="middle" class="node-detail">192.168.0.105</text>
  <text x="1070" y="574" text-anchor="middle" class="node-detail">Et1 → S1 Et5</text>
  <text x="1070" y="594" text-anchor="middle" class="node-detail">Et2 → S2 Et5</text>
