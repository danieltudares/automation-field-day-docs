    <path d="M552 725 H708 A12 12 0 0 1 720 737 V775 H540 V737 A12 12 0 0 1 552 725Z" fill="#047857"/>
    <rect x="760" y="725" width="180" height="140" rx="12" fill="#fff"/>
    <path d="M772 725 H928 A12 12 0 0 1 940 737 V775 H760 V737 A12 12 0 0 1 772 725Z" fill="#047857"/>
