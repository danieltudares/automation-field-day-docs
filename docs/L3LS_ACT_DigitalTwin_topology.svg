  <text x="850" y="845" text-anchor="middle" class="node-detail">eth2 ← L4 Et6</text>

  <!-- Legend and source metadata. -->
  <rect x="50" y="900" width="1340" height="80" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <line x1="80" y1="930" x2="125" y2="930" class="uplink-a"/>
  <text x="140" y="934" class="legend">SPINE1 uplink</text>
  <line x1="285" y1="930" x2="330" y2="930" class="uplink-b"/>
  <text x="345" y="934" class="legend">SPINE2 uplink</text>
